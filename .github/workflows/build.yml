name: Build desktop app

# Push a tag to cut a release:
#   git tag v1.0.1 && git push origin v1.0.1
#
# Running the workflow by hand just produces downloadable artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (blank uses go-app/VERSION)"
        type: string
        required: false
  pull_request:
    paths: ["go-app/**", ".github/workflows/build.yml"]

defaults:
  run:
    working-directory: go-app

permissions:
  contents: read

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum

      - name: Determinar la versión
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-$(cat VERSION)}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must use X.Y.Z" >&2; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The GUI needs GTK/WebKit headers on Linux; the tests do not touch the
      # desktop layer, so only the pure packages are exercised here.
      - name: go vet
        run: go vet ./internal/...

      - name: Pruebas con detector de carreras
        run: go test -race ./internal/...

  macos:
    name: macOS (.dmg)
    needs: test
    runs-on: macos-15
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum

      - name: Comprobar la interfaz en JavaScriptCore
        run: swift scripts/test-ui.swift

      - name: Comprobar recepción nativa de archivos en macOS
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CGO_CFLAGS: "-mmacosx-version-min=13.0"
          CGO_LDFLAGS: "-mmacosx-version-min=13.0"
        run: |
          bash scripts/test-native-macos.sh
          go run ./cmd/genicons
          go test -race .

      - name: Construir el paquete y el .dmg
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            go-app/dist/*.dmg
            go-app/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev xdg-utils desktop-file-utils xvfb dbus-x11

      - name: Construir paquetes Linux
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-linux.sh

      - name: Comprobar argumentos de apertura
        run: go test -race -tags gtk3 .

      - name: Validar e instalar el paquete
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist
          sha256sum -c "FileTransferEasy-$VERSION-linux-$ARCH.deb.sha256"
          sha256sum -c "FileTransferEasy-$VERSION-linux-$ARCH.tar.gz.sha256"
          dpkg-deb --info "FileTransferEasy-$VERSION-linux-$ARCH.deb"
          sudo apt-get install -y "./FileTransferEasy-$VERSION-linux-$ARCH.deb"
          desktop-file-validate /usr/share/applications/org.wails.file_transfer_easy.desktop
          xvfb-run -a dbus-run-session -- python3 ../scripts/test-linux-launch.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            go-app/dist/*-linux-*.deb
            go-app/dist/*-linux-*.tar.gz
            go-app/dist/*-linux-*.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (.exe)
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar Windows y WebView2 nativos
        run: node scripts/test-windows-ui.mjs

      - name: Comprobar ajustes y transferencias bidireccionales
        run: node scripts/test-sharing-features.mjs

      - name: Instalar NSIS
        run: choco install nsis --no-progress -y

      - name: Construir el .exe y el instalador
        shell: pwsh
        run: |
          # choco puts makensis here but does not add it to PATH for this step.
          $env:PATH = "$env:PATH;C:\Program Files (x86)\NSIS"
          .\scripts\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            go-app/dist/FileTransferEasy-*-windows-amd64.exe
            go-app/dist/FileTransferEasy-Setup-*.exe
            go-app/dist/*.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar la release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Instalación

            **macOS** — abre el `.dmg` y arrastra la app a Aplicaciones. La
            entrega usa firma ad hoc y Gatekeeper puede bloquearla en otros equipos.
            La distribución pública requiere Developer ID y notarización.

            **Windows** — usa el instalador, o el `.exe` portable si prefieres
            no instalar nada. Necesita el runtime de WebView2, que ya viene con
            Windows 11 y con Windows 10 actualizado.

            **Linux** — en Debian 12 o Ubuntu 24.04 y posteriores, instala el
            `.deb` de tu arquitectura con `sudo apt install ./archivo.deb`.
            El `.tar.gz` incluye un instalador por usuario. Requiere GTK3 y
            WebKitGTK 4.1; la bandeja depende del entorno de escritorio.

            La primera vez que compartas algo, la app descarga `cloudflared`
            automáticamente.

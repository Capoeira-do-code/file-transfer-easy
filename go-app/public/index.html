<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Archivos compartidos contigo con File Transfer Easy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2217%22%20fill%3D%22%235850d9%22%2F%3E%3Cpath%20d%3D%22M32%2040V16m-10%2010%2010-10%2010%2010M13%2038v10a3%203%200%200%200%203%203h32a3%203%200%200%200%203-3V38%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<title>Archivos compartidos · File Transfer Easy</title>
<script>window.__FTE_BASE__="__FTE_BASE__";</script>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/app.js" defer></script>
</head>
<body>

<a class="skip-link" href="#stage">Saltar al contenido</a>

<div class="page">

  <header class="head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
          <path d="M12 16.6V7.6"/>
          <path d="m8.5 11.1 3.5-3.5 3.5 3.5"/>
        </svg>
      </span>
      <span class="brand-name">File Transfer Easy</span>
    </div>

    <div class="head-body" id="headBody">
      <h1 class="title" id="page-title">Archivos compartidos</h1>
      <p class="summary" id="summary">Cargando los archivos…</p>

      <p class="hint" id="hint" role="status" hidden>
        <span class="hint-dot" aria-hidden="true"></span>
        <span>Sin conexión con el remitente. Reintentando…</span>
      </p>

      <div class="cta" id="cta" hidden>
        <a class="btn btn-primary" id="zipLink" href="#" download>
          <span class="ic ic-20" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M3.9 7.7h16.2v10.6a2.1 2.1 0 0 1-2.1 2.1H6a2.1 2.1 0 0 1-2.1-2.1z"/>
              <path d="M2.9 4.1h18.2v3.6H2.9z"/>
              <path d="M10.3 11.6h3.4"/>
              <path d="M10.3 15.1h3.4"/>
            </svg>
          </span>
          <span>Descargar todo (ZIP)</span>
        </a>

      </div>
    </div>
  </header>

  <main class="stage" id="stage" aria-live="polite" aria-busy="true">
    <!-- Estado inicial: esqueleto de carga (se sustituye desde app.js) -->
    <div class="group">
      <ul class="rows">
        <li class="row"><span class="sk sk-tile"></span><span class="row-text"><span class="sk sk-line w-58"></span><span class="sk sk-line sk-line-sm w-30"></span></span><span class="sk sk-btn"></span></li>
        <li class="row"><span class="sk sk-tile"></span><span class="row-text"><span class="sk sk-line w-72"></span><span class="sk sk-line sk-line-sm w-24"></span></span><span class="sk sk-btn"></span></li>
        <li class="row"><span class="sk sk-tile"></span><span class="row-text"><span class="sk sk-line w-44"></span><span class="sk sk-line sk-line-sm w-34"></span></span><span class="sk sk-btn"></span></li>
        <li class="row"><span class="sk sk-tile"></span><span class="row-text"><span class="sk sk-line w-64"></span><span class="sk sk-line sk-line-sm w-24"></span></span><span class="sk sk-btn"></span></li>
        <li class="row"><span class="sk sk-tile"></span><span class="row-text"><span class="sk sk-line w-50"></span><span class="sk sk-line sk-line-sm w-30"></span></span><span class="sk sk-btn"></span></li>
      </ul>
    </div>
    <p class="sr-only">Cargando la lista de archivos.</p>
  </main>

  <section id="upload-section" class="upload-section" aria-labelledby="upload-title" hidden>
    <div class="upload-heading"><div><h2 id="upload-title">Enviar archivos</h2><p id="upload-limit"></p></div><label class="btn btn-secondary upload-pick">Elegir archivos<input type="file" id="upload-files" multiple></label></div>
    <ul id="upload-selection" class="upload-selection"></ul>
    <div class="upload-actions" id="upload-actions" hidden><button type="button" class="btn btn-primary" id="upload-start">Enviar</button><button type="button" class="btn btn-secondary" id="upload-cancel" hidden>Cancelar</button><span id="upload-status" role="status"></span></div>
    <progress id="upload-progress" value="0" max="100" aria-label="Progreso de la subida" hidden></progress>
  </section>
  <p id="action-message" class="action-message" role="status" hidden></p>
  <footer class="foot" id="foot"></footer>

</div>

<dialog id="unlock-dialog" class="unlock-dialog" aria-labelledby="unlock-title"><form id="unlock-form"><h2 id="unlock-title">Desbloquear archivo</h2><p id="unlock-name"></p><label>Contraseña<input id="unlock-password" type="password" autocomplete="current-password" required></label><p id="unlock-error" class="form-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="btn btn-secondary" id="unlock-cancel">Cancelar</button><button type="submit" class="btn btn-primary" id="unlock-submit">Desbloquear</button></div></form></dialog>
</body>
</html>
